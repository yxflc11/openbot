services:
  postgres:
    # Debian avoids the documented PostgreSQL 17 / Alpine 3.23 ARM64 crash on Apple Silicon.
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: ${OPENBOT_POSTGRES_PASSWORD:-openbot-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - openbot-postgres:/var/lib/postgresql/data

  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENBOT_HOST: 0.0.0.0
      OPENBOT_PORT: 3001
      OPENBOT_DATABASE_URL: postgres://openbot:${OPENBOT_POSTGRES_PASSWORD:-openbot-development-only}@postgres:5432/openbot
      OPENBOT_NODE_TOKEN: ${OPENBOT_NODE_TOKEN:?set OPENBOT_NODE_TOKEN}
      OPENBOT_OWNER_NAME: ${OPENBOT_OWNER_NAME:-Owner}
      OPENBOT_OWNER_PASSWORD: ${OPENBOT_OWNER_PASSWORD:?set OPENBOT_OWNER_PASSWORD}
      OPENBOT_SESSION_TTL_HOURS: ${OPENBOT_SESSION_TTL_HOURS:-12}
      OPENBOT_SECURE_COOKIES: ${OPENBOT_SECURE_COOKIES:-false}
      OPENBOT_ALLOWED_ORIGINS: ${OPENBOT_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OPENBOT_OBJECT_STORE_PATH: /var/lib/openbot/objects
      OPENBOT_MODEL_CREDENTIAL_KEY_PATH: /var/lib/openbot/model-credentials/key
      OPENBOT_MODEL_CUSTOM_BASE_URLS: ${OPENBOT_MODEL_CUSTOM_BASE_URLS:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1}
      MOONSHOT_MODEL: ${MOONSHOT_MODEL:-kimi-k3}
      MOONSHOT_REASONING_EFFORT: ${MOONSHOT_REASONING_EFFORT:-low}
      OPENBOT_MODEL_MAX_TOKENS: ${OPENBOT_MODEL_MAX_TOKENS:-4096}
      OPENBOT_MODEL_TIMEOUT_MS: ${OPENBOT_MODEL_TIMEOUT_MS:-90000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENBOT_WEB_SEARCH_CONNECTION_ID: ${OPENBOT_WEB_SEARCH_CONNECTION_ID:-}
      OPENBOT_WEB_SEARCH_MODEL: ${OPENBOT_WEB_SEARCH_MODEL:-kimi-k3}
      OPENBOT_MODEL_MAX_CONCURRENT_RUNS: ${OPENBOT_MODEL_MAX_CONCURRENT_RUNS:-2}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - openbot-objects:/var/lib/openbot/objects
      - openbot-model-credentials:/var/lib/openbot/model-credentials

volumes:
  openbot-postgres:
  openbot-objects:
  openbot-model-credentials:
