name: Feature request
description: Propose a scoped capability tied to an acceptance journey.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        OpenBot adopts maintained standards and narrow upstream integrations before local implementations. Large features should start with a concrete user journey and explicit permission boundary.
  - type: checkboxes
    id: existing
    attributes:
      label: Existing work
      options:
        - label: I searched existing issues, pull requests, and the roadmap for this request.
          required: true
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What should the user be able to complete?
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Acceptance journey
      description: List the shortest end-to-end path that proves the outcome works.
      placeholder: |
        1. Given …
        2. When …
        3. OpenBot …
        4. The user can verify …
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Permission and failure boundary
      description: What must require approval, fail closed or remain out of scope?
    validations:
      required: true
  - type: textarea
    id: upstreams
    attributes:
      label: Existing open-source implementations
      description: Link maintained repositories or open standards already researched. Include versions and licenses when known, or explain why no suitable implementation was found.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed reuse decision
      description: Which standard, dependency, adapter, upstream contribution, or narrow fork should be used? What OpenBot-specific gap remains?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Primary platform
      options:
        - Platform-independent
        - Web client
        - Linux Server
        - Windows Worker Host
        - macOS Worker Host
        - Linux Worker Host
        - Mobile or managed device
        - Multiple platforms
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options: [Spike, M0, M1, M2, M3, M4, M5]
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution intent
      options:
        - I can open a pull request after scope agreement
        - I can test or review on a target platform
        - I am proposing the work for another contributor
    validations:
      required: true
